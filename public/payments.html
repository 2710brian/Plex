<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex CRM - Betalinger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { background-color: white; margin: 5% auto; padding: 30px; border-radius: 12px; width: 90%; max-width: 650px; border-top: 8px solid #6366f1; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #4b5563; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
        input, select { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; font-size: 0.85rem; background-color: #f9fafb; margin-bottom: 10px; font-weight: 600; }
        .nav-active { background-color: #dc2626 !important; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        
        /* SEARCH DROPDOWN STYLING */
        #search-results-box { 
            position: absolute; 
            z-index: 9999; 
            background: white; 
            width: 100%; 
            border: 2px solid #6366f1; 
            border-top: none;
            border-radius: 0 0 10px 10px; 
            max-height: 250px; 
            overflow-y: auto; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            display: none;
            margin-top: -10px;
        }
        .search-item { padding: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 900; text-transform: uppercase; color: #1e293b; display: flex; justify-content: space-between; }
        .search-item:hover { background-color: #f5f3ff; color: #6366f1; padding-left: 20px; transition: all 0.2s; }
        .search-item span { color: #94a3b8; font-size: 10px; font-weight: 400; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-slate-900 font-sans uppercase font-black italic">

    <script>
        // --- SIKKERHED OG RETTIGHEDS-STYRING ---
        const user = JSON.parse(localStorage.getItem('crm_user'));
        if(!user) { window.location.href = '/login.html'; }

        function checkAccess() {
            if (user.type === 'admin') return; 
            const allowedPages = user.menu_access ? user.menu_access.split(',') : ['index.html'];
            document.querySelectorAll('#sidebar-nav a').forEach(link => {
                const href = link.getAttribute('href');
                if (!allowedPages.includes(href)) { link.style.display = 'none'; }
            });
            if (!allowedPages.includes('payments.html')) { window.location.href = '/index.html'; }
        }
        function logout() { localStorage.removeItem('crm_user'); window.location.href = '/login.html'; }
    </script>

    <!-- SIDEBAR -->
    <div class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl tracking-wider not-italic">
        <div class="p-6 text-2xl font-black border-b border-slate-800 text-red-600 tracking-tighter italic">⦿ PLEX CRM</div>
        <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 text-[10px] font-bold uppercase tracking-widest">
            <a href="index.html" class="nav-item block p-3 hover:bg-slate-800 rounded">👥 Klient-Oversigt</a>
            <a href="approvals.html" id="nav-approvals" class="nav-item block p-3 hover:bg-slate-800 rounded flex justify-between items-center text-orange-400">
                <span>⏳ Godkendelser</span>
                <span class="bg-orange-600 text-white text-[9px] px-2 py-0.5 rounded-full font-black" id="badge-count">0</span>
            </a>
            <a href="resellers.html" id="nav-resellers" class="nav-item block p-3 hover:bg-slate-800 rounded text-blue-400">👤 Resellers</a>
            <a href="commission.html" id="nav-commission" class="nav-item block p-3 hover:bg-slate-800 rounded text-yellow-500 font-black">💰 Provision & Tal</a>
            <a href="settings.html" id="nav-settings" class="nav-item block p-3 hover:bg-slate-800 rounded text-emerald-400 font-black">⚙️ Pakker</a>
            <a href="payments.html" class="nav-item block p-3 bg-red-600 rounded nav-active text-white mt-4 border-t border-slate-800 pt-4">💳 Betalinger</a>
            
            <button onclick="logout()" class="w-full text-left p-3 hover:bg-red-900/30 text-red-500 mt-10 border-t border-slate-800 transition-colors flex items-center italic font-black uppercase text-[10px]">
                <span class="mr-2 text-lg">🔒</span> Log ud
            </button>
        </nav>
        <div class="p-4 border-t border-slate-800 bg-black/20 text-center text-[9px]">Admin: Brian</div>
    </div>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col overflow-hidden not-italic">
        <header class="bg-white shadow-sm p-5 flex justify-between items-center px-10 border-b font-black uppercase italic">
            <div class="flex items-center space-x-8">
                <h2 class="text-2xl text-indigo-600 tracking-tighter">Betalings Log</h2>
                <input type="text" id="paySearch" onkeyup="render()" placeholder="SØG..." class="w-80 bg-slate-50 border-2 border-slate-100 rounded-xl py-2 px-4 text-[11px] outline-none focus:border-indigo-500">
            </div>
            <button onclick="openModal()" class="bg-indigo-600 text-white px-8 py-2.5 rounded-xl shadow-xl text-[10px] tracking-widest hover:bg-indigo-700 transition">+ Registrer Betaling</button>
        </header>

        <main class="flex-1 overflow-auto p-10 font-black italic uppercase">
            <div class="bg-white rounded-xl shadow-2xl border border-indigo-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-indigo-50 text-indigo-800 text-[10px] tracking-widest border-b uppercase italic">
                        <tr><th class="p-5">Dato</th><th class="p-5">Kunde</th><th class="p-5">Metode</th><th class="p-5">Beløb (€)</th><th class="p-5 text-center">Status</th></tr>
                    </thead>
                    <tbody id="payout-table-body" class="text-[12px] divide-y divide-gray-50 tracking-tight font-bold italic">
                        <!-- Indlæses via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL: REGISTRER BETALING -->
    <div id="paymentModal" class="modal">
        <div class="modal-content shadow-2xl">
            <div class="flex justify-between items-center border-b-4 border-indigo-50 pb-4 mb-8 text-indigo-600 uppercase italic font-black">
                <h2 class="text-2xl tracking-tighter">Ny Indbetaling</h2>
                <!-- VISUEL TÆLLER TIL DEBUG -->
                <span id="customer-count-badge" class="bg-indigo-50 text-indigo-400 text-[9px] px-3 py-1 rounded-full font-black tracking-widest">Kunder indlæst: 0</span>
            </div>
            
            <form id="payForm" onsubmit="savePayment(event)" class="space-y-6 italic font-black">
                <div class="grid grid-cols-2 gap-8">
                    <div class="relative">
                        <label>Søg efter Kunde</label>
                        <input type="text" id="p-customer" oninput="handleLiveSearch(this.value)" placeholder="SKRIV NAVN..." autocomplete="off" required class="border-2 border-indigo-100 focus:border-indigo-600 outline-none h-12">
                        <div id="search-results-box"></div>
                    </div>
                    <div><label>Beløb (€)</label><input type="number" id="p-amount" step="0.01" placeholder="0,00" required class="h-12"></div>
                    <div><label>Betalings-metode</label><select id="p-method" class="h-12"><option>Vivid Link</option><option>Revolut</option><option>Bank</option><option>Cash</option></select></div>
                    <div><label>Agent</label><select id="p-agent" class="h-12"><option>Brian</option><option>Kenneth (KU)</option></select></div>
                </div>

                <div class="mt-12 pt-8 border-t flex justify-end font-black uppercase text-[10px]">
                    <button type="button" onclick="closeModal()" class="mr-10 text-gray-400 hover:text-black">Annuller</button>
                    <button type="submit" class="bg-indigo-600 text-white px-16 py-4 rounded-xl shadow-2xl hover:bg-indigo-700 transition tracking-[0.2em]">Gem Registrering</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let payments = [];
        let customers = [];

        async function fetchAllData() {
            try {
                // 1. Hent Betalinger
                const pRes = await fetch('/api/payments');
                payments = await pRes.json();
                
                // 2. Hent Kunder (FRA KLIENTER TABELLEN)
                const cRes = await fetch('/api/customers');
                customers = await cRes.json();
                
                // Opdater visuel tæller så du kan se om de er der
                document.getElementById('customer-count-badge').innerText = "Kunder indlæst: " + customers.length;
                
                render();
            } catch (e) { console.error("Database connection failed", e); }
        }

        // --- FORBEDRET LIVE SØGNING ---
        function handleLiveSearch(val) {
            const resultsBox = document.getElementById('search-results-box');
            if (val.length < 1) {
                resultsBox.style.display = 'none';
                return;
            }

            // Vi søger i 'name' kolonnen fra customers tabellen
            const matches = customers.filter(c => 
                c.name.toLowerCase().includes(val.toLowerCase()) ||
                (c.plex_id && c.plex_id.toLowerCase().includes(val.toLowerCase()))
            ).slice(0, 8);
            
            if (matches.length > 0) {
                resultsBox.innerHTML = matches.map(c => `
                    <div class="search-item" onclick="selectCustomer('${c.name}')">
                        ${c.name} <span>${c.plex_id || ''}</span>
                    </div>
                `).join('');
                resultsBox.style.display = 'block';
            } else {
                resultsBox.innerHTML = `<div class="p-4 text-[10px] text-gray-400 italic text-center">INGEN MATCHENDE KUNDER FUNDET</div>`;
                resultsBox.style.display = 'block';
            }
        }

        function selectCustomer(name) {
            document.getElementById('p-customer').value = name;
            document.getElementById('search-results-box').style.display = 'none';
        }

        function render() {
            const term = document.getElementById('paySearch').value.toLowerCase();
            const tbody = document.getElementById('payout-table-body');
            tbody.innerHTML = payments.filter(p => p.customer_name.toLowerCase().includes(term)).map(p => `
                <tr class="hover:bg-indigo-50/50 transition border-b italic">
                    <td class="p-5 font-mono text-[10px]">${new Date(p.payment_date).toLocaleDateString()}</td>
                    <td class="p-5 font-black text-slate-800 uppercase">${p.customer_name}</td>
                    <td class="p-5 text-indigo-600 font-bold">${p.method}</td>
                    <td class="p-5 font-black text-slate-900">€ ${parseFloat(p.amount_eur).toFixed(2)}</td>
                    <td class="p-5 text-center"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[9px] font-black uppercase">Betalt</span></td>
                </tr>`).join('');
        }

        async function savePayment(e) {
            e.preventDefault();
            const data = { 
                customer_name: document.getElementById('p-customer').value, 
                amount_eur: document.getElementById('p-amount').value, 
                method: document.getElementById('p-method').value, 
                agent_name: document.getElementById('p-agent').value 
            };
            const res = await fetch('/api/payments/save', { 
                method:'POST', 
                headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify(data) 
            });
            if(res.ok) { closeModal(); fetchAllData(); }
        }

        function openModal() { 
            document.getElementById('payForm').reset();
            document.getElementById('search-results-box').style.display = 'none';
            document.getElementById('paymentModal').style.display = 'block'; 
        }
        function closeModal() { document.getElementById('paymentModal').style.display = 'none'; }
        
        window.onload = function() {
            checkAccess();
            fetchAllData();
        };
    </script>
</body>
</html>
