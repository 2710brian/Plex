<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Plex CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: white; margin: 1% auto; padding: 25px; border-radius: 12px; width: 95%; max-width: 1400px; max-height: 96vh; overflow-y: auto; border-top: 8px solid #dc2626; }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #4b5563; margin-bottom: 2px; text-transform: uppercase; }
        input, select, textarea { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; font-size: 0.8rem; background-color: #f9fafb; margin-bottom: 10px; }
        tr.clickable { cursor: pointer; }
        tr.clickable:hover { background-color: #fef2f2 !important; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-slate-900">

    <!-- Sidebar -->
    <div class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl font-bold uppercase text-[10px]">
        <div class="p-6 text-2xl font-black border-b border-slate-800 italic text-red-600 tracking-tighter">⦿ PLEX CRM</div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="index.html" class="block p-3 bg-red-600 rounded">👥 <span class="lang-dk">Klient-Oversigt</span><span class="lang-uk hidden">Client Overview</span></a>
            <a href="settings.html" class="block p-3 hover:bg-slate-800 rounded">⚙️ <span class="lang-dk">Pakke Indstillinger</span><span class="lang-uk hidden">Package Settings</span></a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <div class="flex justify-between items-center">
                <button onclick="setLang('dk')" id="btn-dk" class="text-red-500 underline">DK</button>
                <button onclick="setLang('uk')" id="btn-uk" class="text-slate-500">UK</button>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white p-5 flex justify-between items-center border-b shadow-sm">
            <h2 class="text-xl font-black uppercase italic tracking-tighter"><span class="lang-dk">Klienter</span><span class="lang-uk hidden">Clients</span></h2>
            <button onclick="openModal('addClientModal', false)" class="bg-red-600 text-white px-8 py-2.5 rounded font-black uppercase text-[10px] tracking-widest">+ <span class="lang-dk">Ny Klient</span><span class="lang-uk hidden">New Client</span></button>
        </header>

        <main class="flex-1 overflow-auto p-8">
            <div class="bg-white rounded shadow-lg border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b text-slate-400 text-[9px] font-black uppercase tracking-widest">
                        <tr><th class="p-4">Navn</th><th class="p-4">Email</th><th class="p-4 text-center">Pakke Nr</th><th class="p-4">Handling</th></tr>
                    </thead>
                    <tbody class="text-[11px] font-bold uppercase italic">
                        <tr class="clickable border-b" onclick="openModal('addClientModal', true, 'Mads Aggerholm')">
                            <td class="p-4">Mads Aggerholm</td><td class="p-4 lowercase italic font-normal">shin@shinhypnose.dk</td><td class="p-4 text-center">5</td><td class="p-4 text-center text-gray-300">⚙️</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal (Alle felter fra billede 1 og 3) -->
    <div id="addClientModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center border-b pb-4 mb-6 uppercase italic font-black">
                <h2 id="modal-title">Add Client</h2>
                <button onclick="closeModal('addClientModal')" class="text-gray-300 hover:text-black text-4xl">&times;</button>
            </div>
            
            <div class="grid grid-cols-4 gap-4">
                <div class="col-span-2"><label>Name *</label><input type="text" id="inp-name"></div>
                <div><label>Email</label><input type="email"></div>
                <div><label>Mobile</label><input type="text"></div>
                
                <div class="col-span-4 border-t pt-4 mt-2 font-black uppercase text-[10px] text-red-600">Teknisk (Plex / IPTV)</div>
                <div><label>Plex ID</label><input type="text"></div>
                <div><label>Mac Adresse</label><input type="text"></div>
                <div><label>App</label><input type="text"></div>
                <div><label>Næste Betaling</label><input type="date"></div>
                <div><label>Betalt?</label><select><option>Ja</option><option>Nej</option></select></div>
                <div><label>Admin Panel</label><select><option>N</option><option>Y</option></select></div>
                <div><label>Overseer</label><select><option>N</option><option>Y</option></select></div>
                <div><label>Agent</label><select><option>BH</option><option>KU</option></select></div>
            </div>

            <div class="mt-8 pt-4 border-t flex justify-end font-black uppercase text-[10px]">
                <button onclick="closeModal('addClientModal')" class="mr-8 text-gray-400">Cancel</button>
                <button class="bg-slate-900 text-white px-10 py-3 rounded">Save</button>
            </div>
        </div>
    </div>

    <script>
        function setLang(lang) {
            document.querySelectorAll('.lang-dk').forEach(el => el.style.display = (lang === 'dk' ? 'inline' : 'none'));
            document.querySelectorAll('.lang-uk').forEach(el => el.style.display = (lang === 'uk' ? 'inline' : 'none'));
            document.getElementById('btn-dk').className = (lang === 'dk' ? 'text-red-500 underline' : 'text-slate-500');
            document.getElementById('btn-uk').className = (lang === 'uk' ? 'text-red-500 underline' : 'text-slate-500');
        }

        function openModal(id, isEdit, name = '') {
            document.getElementById(id).style.display = "block";
            document.getElementById('modal-title').innerText = isEdit ? "Rediger: " + name : "Opret ny klient";
            if(isEdit) document.getElementById('inp-name').value = name;
        }

        function closeModal(id) { document.getElementById(id).style.display = "none"; }
    </script>
</body>
</html>
