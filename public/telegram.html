<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex CRM - Telegram Master Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { background-color: white; margin: 10% auto; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; border-top: 8px solid #0ea5e9; }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #4b5563; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
        input, textarea, select { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; font-size: 0.85rem; background-color: #f9fafb; margin-bottom: 10px; font-weight: 600; }
        .nav-active { background-color: #dc2626 !important; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .chat-scroll { height: calc(100vh - 205px); overflow-y: auto; display: flex; flex-direction: column; }
        .message-bubble { max-width: 80%; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; font-size: 14px; line-height: 1.4; position: relative; }
        .msg-in { background-color: #f3f4f6; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-out { background-color: #e0f2fe; color: #0369a1; align-self: flex-end; border-bottom-right-radius: 2px; box-shadow: 0 4px 6px -1px rgba(14,165,233,0.1); }
        .btn-active-support { background-color: white; color: #0ea5e9; border: 1px solid #e0f2fe; }
        .btn-active-info { background-color: white; color: #f59e0b; border: 1px solid #fef3c7; }
        .btn-inactive { color: #94a3b8; background-color: transparent; }
        .recording-pulse { animation: pulse 1.5s infinite; color: #ef4444; font-weight: 900; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        audio { height: 35px; width: 220px; margin-top: 5px; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-slate-900 font-sans uppercase font-black italic">

    <!-- SIDEBAR (FULL 7-ITEM) -->
    <div class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl tracking-wider not-italic">
        <div class="p-6 text-2xl font-black border-b border-slate-800 text-red-600">⦿ PLEX CRM</div>
        <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 text-[10px] font-bold uppercase tracking-widest">
            <a href="index.html" class="nav-item block p-3 hover:bg-slate-800 rounded">👥 Klient-Oversigt</a>
            <a href="approvals.html" class="nav-item block p-3 hover:bg-slate-800 rounded">⏳ Godkendelser</a>
            <a href="resellers.html" class="nav-item block p-3 hover:bg-slate-800 rounded">👤 Resellers</a>
            <a href="commission.html" class="nav-item block p-3 hover:bg-slate-800 rounded">💰 Provision & Tal</a>
            <a href="settings.html" class="nav-item block p-3 hover:bg-slate-800 rounded">⚙️ Pakker</a>
            <a href="telegram.html" class="nav-item block p-3 bg-red-600 rounded nav-active text-white border-t border-slate-800 mt-4">💬 Telegram Chat</a>
            <a href="payments.html" class="nav-item block p-3 hover:bg-slate-800 rounded">💳 Betalinger</a>
        </nav>
        <div class="p-4 border-t border-slate-800 bg-black/20 text-center text-[9px]">Admin: Brian</div>
    </div>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col overflow-hidden not-italic">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center px-10 border-b">
            <div class="flex items-center space-x-6">
                <h2 class="text-xl font-black uppercase italic tracking-tighter">Telegram <span class="text-sky-500" id="header-bot-title">Support</span></h2>
                <div class="flex bg-slate-100 p-1 rounded-lg border italic shadow-inner">
                    <button id="acc-support" onclick="switchBot('support')" class="btn-active-support px-5 py-2 rounded text-[10px] font-black uppercase tracking-widest transition-all shadow-sm">Support</button>
                    <button id="acc-info" onclick="switchBot('info')" class="btn-inactive px-5 py-2 rounded text-[10px] font-black uppercase tracking-widest">Broadcast</button>
                </div>
            </div>
            <button onclick="openTokenModal()" class="text-slate-300 hover:text-sky-500 transition text-2xl">⚙️</button>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <div class="w-80 bg-white border-r flex flex-col shrink-0">
                <div class="p-4 border-b bg-slate-50/50 font-black uppercase italic"><input type="text" placeholder="SØG CHAT..." class="w-full text-[11px] p-2 border rounded-xl outline-none shadow-sm"></div>
                <div id="chat-list" class="flex-1 overflow-y-auto divide-y font-black uppercase italic"></div>
            </div>

            <div class="flex-1 flex flex-col bg-[#f0f2f5] relative">
                <div id="chat-header-bar" class="p-4 bg-white/80 backdrop-blur border-b hidden font-black uppercase shadow-sm italic"><h3 class="text-xs text-slate-700 font-black" id="active-user-name">Kunde</h3></div>
                <div id="message-container" class="flex-1 p-6 chat-scroll space-y-3"></div>

                <!-- BREDT INPUT MODUL -->
                <div id="chat-input-area" class="p-6 bg-white border-t hidden shadow-2xl">
                    <div class="flex items-center space-x-6 bg-slate-50 p-4 rounded-3xl border-2 border-slate-200 shadow-inner">
                        <div class="flex space-x-4 px-4 border-r border-slate-200 text-2xl">
                            <button onclick="triggerFile('img')">🖼️</button>
                            <button onclick="triggerFile('vid')">📹</button>
                            <button id="voice-btn" onclick="toggleVoice()" class="text-3xl">🎤</button>
                        </div>
                        <input type="file" id="file-img" onchange="handleFileUpload(this, 'img')" class="hidden" accept="image/*">
                        <input type="file" id="file-vid" onchange="handleFileUpload(this, 'vid')" class="hidden" accept="video/*">

                        <input type="text" id="msg-input" placeholder="SKRIV SVAR HER..." class="flex-1 bg-transparent text-lg outline-none font-black italic px-4">
                        <button onclick="doSendMessage()" class="bg-sky-500 text-white px-12 py-4 rounded-2xl font-black uppercase text-xs shadow-xl hover:bg-sky-600 transition tracking-widest">SEND</button>
                    </div>
                    <div id="rec-indicator" class="hidden text-center mt-3 text-sm font-black uppercase tracking-widest recording-pulse">🔴 OPTAGER LYD... KLIK IGEN FOR AT SENDE</div>
                </div>
            </div>

            <div class="w-80 bg-white border-l p-6 flex flex-col space-y-8 font-black uppercase italic text-[10px] tracking-widest overflow-y-auto shadow-2xl">
                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 shadow-inner text-center">
                    <h4 class="text-slate-400 mb-4 border-b pb-1 uppercase italic tracking-tighter">Opret Intern Note</h4>
                    <textarea id="note-text" class="h-28 mb-3 italic bg-white shadow-sm font-bold" placeholder="BESKRIV HÆNDELSE..."></textarea>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <div><label>Dato</label><input type="date" id="note-date"></div>
                        <div><label>Tid</label><input type="time" id="note-time"></div>
                    </div>
                    <button onclick="saveNote()" class="bg-slate-900 text-white w-full py-4 rounded-xl shadow-xl uppercase hover:bg-black transition tracking-widest">Gem Note</button>
                </div>
                <div id="note-list" class="space-y-4"><h4 class="text-slate-400 border-b pb-1">Historik</h4></div>
            </div>
        </div>
    </div>

    <!-- MODAL: TOKENS -->
    <div id="tokenModal" class="modal"><div class="modal-content"><h2 class="text-xl font-black border-b pb-4 mb-6 uppercase text-sky-600 italic">API Setup</h2><div class="space-y-4"><div><label>Support Token</label><input type="password" id="t-support"></div><div><label>Info Token</label><input type="password" id="t-info"></div></div><div class="mt-8 flex justify-end"><button onclick="closeModal()" class="mr-6 text-gray-400 uppercase">Luk</button><button onclick="alert('Gemt!')" class="bg-slate-900 text-white px-10 py-3 rounded-lg uppercase text-xs font-black">Gem</button></div></div></div>

    <script>
        let allMessages = [];
        let activeId = null;
        let activeBot = 'support';
        let mediaRecorder;
        let audioChunks = [];

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return new Date().toLocaleString();
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }

        function renderContent(text) {
            if (text.startsWith('MEDIA|')) {
                const [_, type, filename] = text.split('|');
                const path = `/uploads/${filename}`;
                if (type === 'img') return `<img src="${path}" class="max-w-xs rounded-xl shadow-lg border-4 border-white">`;
                if (type === 'vid') return `<video controls class="max-w-xs rounded-xl border-4 border-white shadow-lg"><source src="${path}"></video>`;
                if (type === 'voice') return `<div class="bg-white/50 p-2 rounded-lg border-2 border-blue-100"><span class="block text-[8px] font-black mb-1">VOICE NOTE</span><audio controls class="w-48"><source src="${path}"></audio></div>`;
            }
            return text;
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/messages');
                allMessages = await res.json();
                renderList();
                if(activeId) renderChat(activeId);
            } catch(e) {}
        }

        function renderList() {
            const list = document.getElementById('chat-list');
            const unique = {};
            allMessages.filter(m => m.bot_type === activeBot).forEach(m => unique[m.chat_id] = m);
            list.innerHTML = Object.values(unique).reverse().map(m => `
                <div onclick="selectChat('${m.chat_id}', '${m.sender_name}')" class="p-6 cursor-pointer hover:bg-slate-50 border-b transition ${activeId == m.chat_id ? 'bg-sky-50 border-l-8 border-sky-500 shadow-xl' : ''}">
                    <div class="font-black text-slate-800 text-sm">${m.sender_name}</div>
                    <div class="text-[11px] text-slate-400 truncate italic font-bold">${m.message_text.includes('MEDIA|') ? '📎 MEDIEFIL' : m.message_text}</div>
                </div>`).join('');
        }

        function selectChat(id, name) {
            activeId = id;
            document.getElementById('chat-header-bar').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            document.getElementById('active-user-name').innerText = name;
            renderChat(id);
            renderList();
        }

        function renderChat(id) {
            const box = document.getElementById('message-container');
            const chatMsgs = allMessages.filter(m => m.chat_id == id && m.bot_type === activeBot);
            box.innerHTML = chatMsgs.map(m => `
                <div class="message-bubble ${m.direction == 'in' ? 'msg-in shadow-sm' : 'msg-out shadow-lg'}">
                    <div class="not-italic font-black text-sm">${renderContent(m.message_text)}</div>
                    <div class="text-[8px] text-right mt-2 opacity-50 font-black uppercase">${formatDate(m.created_at)}</div>
                </div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function doSendMessage() {
            const input = document.getElementById('msg-input');
            if(!input.value || !activeId) return;
            await fetch('/api/send-message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chatId: activeId, text: input.value, botType: activeBot })
            });
            input.value = '';
            fetchHistory();
        }

        function triggerFile(id) { document.getElementById('file-'+id).click(); }
        async function handleFileUpload(input, type) {
            const formData = new FormData();
            formData.append('file', input.files[0]);
            formData.append('chatId', activeId);
            formData.append('type', type);
            formData.append('botType', activeBot);
            await fetch('/api/send-media', { method: 'POST', body: formData });
            fetchHistory();
        }

        async function toggleVoice() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                document.getElementById('rec-indicator').classList.add('hidden');
                document.getElementById('voice-btn').innerText = "🎤";
            } else {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'voice.webm');
                    formData.append('chatId', activeId);
                    formData.append('type', 'voice');
                    formData.append('botType', activeBot);
                    await fetch('/api/send-media', { method: 'POST', body: formData });
                    fetchHistory();
                };
                mediaRecorder.start();
                document.getElementById('rec-indicator').classList.remove('hidden');
                document.getElementById('voice-btn').innerText = "⏹️";
            }
        }

        function saveNote() {
            const text = document.getElementById('note-text').value;
            const d = document.getElementById('note-date').value;
            const t = document.getElementById('note-time').value;
            if(!text) return;
            const div = document.createElement('div');
            div.className = "bg-yellow-50 p-4 rounded-xl border border-yellow-100 shadow-sm transition-all hover:scale-105";
            div.innerHTML = `<p class="font-black text-yellow-900 leading-tight">${text}</p><span class="text-[8px] opacity-40 block mt-3 uppercase font-black tracking-widest">${d} ${t}</span>`;
            document.getElementById('note-list').prepend(div);
            document.getElementById('note-text').value = '';
        }

        function setNow() {
            const now = new Date();
            document.getElementById('note-date').valueAsDate = now;
            document.getElementById('note-time').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        }

        function switchBot(t) { activeBot = t; activeId = null; setNow(); fetchHistory(); 
            document.getElementById('header-bot-title').innerText = (t === 'support') ? 'Support' : 'Broadcast';
            document.getElementById('acc-support').className = (t === 'support') ? 'btn-active-support px-6 py-2 rounded text-[10px] font-black uppercase' : 'btn-inactive px-6 py-2 rounded text-[10px] font-black';
            document.getElementById('acc-info').className = (t === 'info') ? 'btn-active-info px-6 py-2 rounded text-[10px] font-black' : 'btn-inactive px-6 py-2 rounded text-[10px] font-black';
            document.getElementById('chat-header-bar').classList.add('hidden');
            document.getElementById('chat-input-area').classList.add('hidden');
            document.getElementById('message-container').innerHTML = '';
        }

        function closeModal() { document.getElementById('tokenModal').style.display = 'none'; }
        function openTokenModal() { document.getElementById('tokenModal').style.display = 'block'; }
        setInterval(fetchHistory, 5000);
    </script>
</body>
</html>
