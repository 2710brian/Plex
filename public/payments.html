<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex CRM - Betalinger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { background-color: white; margin: 5% auto; padding: 30px; border-radius: 12px; width: 90%; max-width: 650px; border-top: 8px solid #6366f1; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #4b5563; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
        input, select { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; font-size: 0.85rem; background-color: #f9fafb; margin-bottom: 10px; font-weight: 600; }
        
        /* Søgeboks Styling */
        #search-results-box { position: absolute; z-index: 9999; background: white; width: 92%; border: 2px solid #6366f1; border-top: none; border-radius: 0 0 10px 10px; max-height: 250px; overflow-y: auto; display: none; margin-top: -10px; }
        .search-item { padding: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 900; text-transform: uppercase; color: #1e293b; }
        .search-item:hover { background-color: #f5f3ff; color: #6366f1; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-slate-900 font-sans uppercase font-black italic">

    <!-- SIDEBAR -->
    <div class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl tracking-wider">
        <div class="p-6 text-2xl font-black border-b border-slate-800 text-red-600 tracking-tighter italic">⦿ PLEX CRM</div>
        <nav class="flex-1 p-4 space-y-1 text-[10px] font-bold uppercase tracking-widest">
            <a href="index.html" class="block p-3 hover:bg-slate-800 rounded">👥 Klient-Oversigt</a>
            <a href="payments.html" class="block p-3 bg-red-600 rounded text-white mt-4 border-t border-slate-800 pt-4">💳 Betalinger</a>
            <button onclick="localStorage.removeItem('crm_user'); window.location.href='/login.html';" class="w-full text-left p-3 hover:bg-red-900/30 text-red-500 mt-10 border-t border-slate-800 transition-colors flex items-center italic font-black uppercase text-[10px]">🔒 Log ud</button>
        </nav>
    </div>

    <!-- MAIN -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm p-5 flex justify-between items-center px-10 border-b font-black uppercase italic">
            <h2 class="text-2xl text-indigo-600 tracking-tighter">Betalings-Log</h2>
            <button onclick="openModal()" class="bg-indigo-600 text-white px-8 py-2.5 rounded-xl shadow-xl text-[10px]">+ Registrer Betaling</button>
        </header>

        <main class="flex-1 overflow-auto p-10 font-black italic uppercase">
            <div class="bg-white rounded-xl shadow-2xl border border-indigo-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-indigo-50 text-indigo-800 text-[10px] tracking-widest border-b uppercase italic">
                        <tr><th class="p-5">Dato</th><th class="p-5">Kunde</th><th class="p-5">Metode</th><th class="p-5">Beløb (€)</th></tr>
                    </thead>
                    <tbody id="payout-table-body" class="text-[12px] divide-y divide-gray-50 tracking-tight font-bold italic"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <!-- LUK X KNAP -->
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-4xl">&times;</button>
            
            <h2 class="text-2xl font-black mb-8 italic uppercase text-indigo-600 tracking-tighter">Ny Indbetaling</h2>
            <form id="payForm" onsubmit="savePayment(event)" class="space-y-6 italic font-black">
                <div class="relative">
                    <label>Søg efter Kunde</label>
                    <input type="text" id="p-customer" oninput="handleLiveSearch(this.value)" placeholder="SKRIV NAVN..." autocomplete="off" required>
                    <div id="search-results-box"></div>
                </div>
                <input type="number" id="p-amount" step="0.01" placeholder="Beløb (€)" required>
                <select id="p-method"><option>Vivid</option><option>Revolut</option><option>Cash</option></select>
                <button type="submit" class="bg-indigo-600 text-white w-full py-4 rounded-xl">Gem Betaling</button>
            </form>
        </div>
    </div>

    <script>
        let payments = [];
        let customers = [];
        const user = JSON.parse(localStorage.getItem('crm_user'));

        async function fetchAllData() {
            try {
                const [cRes, pRes] = await Promise.all([fetch('/api/customers'), fetch('/api/payments')]);
                customers = await cRes.json();
                payments = await pRes.json();
                render();
            } catch (e) { console.error("Fejl:", e); }
        }

        function handleLiveSearch(val) {
            const box = document.getElementById('search-results-box');
            if (val.length < 1) { box.style.display = 'none'; return; }
            const matches = customers.filter(c => c.name.toLowerCase().includes(val.toLowerCase()));
            box.innerHTML = matches.map(c => `<div class="search-item" onclick="selectCustomer('${c.name}')">${c.name}</div>`).join('');
            box.style.display = matches.length ? 'block' : 'none';
        }

        function selectCustomer(name) {
            document.getElementById('p-customer').value = name;
            document.getElementById('search-results-box').style.display = 'none';
        }

        function render() {
            document.getElementById('payout-table-body').innerHTML = payments.map(p => `
                <tr class="border-b italic font-bold">
                    <td class="p-5">${p.payment_date ? new Date(p.payment_date).toLocaleDateString() : 'Ukendt'}</td>
                    <td class="p-5">${p.customer_name}</td>
                    <td class="p-5">${p.method}</td>
                    <td class="p-5">€ ${parseFloat(p.amount_eur).toFixed(2)}</td>
                </tr>`).join('');
        }

        async function savePayment(e) {
            e.preventDefault();
            const data = { 
                customer_name: document.getElementById('p-customer').value, 
                amount_eur: document.getElementById('p-amount').value, 
                method: document.getElementById('p-method').value, 
                agent_name: user ? user.name : 'Unknown' 
            };
            await fetch('/api/payments/save', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
            closeModal(); fetchAllData();
        }

        function openModal() { document.getElementById('paymentModal').style.display = 'block'; }
        function closeModal() { document.getElementById('paymentModal').style.display = 'none'; }
        window.onload = fetchAllData;
    </script>
</body>
</html>
