<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex CRM - Telegram Master Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { background-color: white; margin: 10% auto; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; border-top: 8px solid #0ea5e9; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #4b5563; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
        input, textarea, select { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; font-size: 0.85rem; background-color: #f9fafb; margin-bottom: 10px; font-weight: 600; }
        .nav-active { background-color: #dc2626 !important; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .chat-scroll { height: calc(100vh - 200px); overflow-y: auto; display: flex; flex-direction: column; }
        .message-bubble { max-width: 80%; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; font-size: 14px; line-height: 1.4; position: relative; }
        .msg-in { background-color: #f3f4f6; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-out { background-color: #e0f2fe; color: #0369a1; align-self: flex-end; border-bottom-right-radius: 2px; box-shadow: 0 4px 6px -1px rgba(14,165,233,0.1); }
        .btn-active-support { background-color: white; color: #0ea5e9; border: 1px solid #e0f2fe; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-active-info { background-color: white; color: #f59e0b; border: 1px solid #fef3c7; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-inactive { color: #94a3b8; background-color: transparent; border: 1px solid transparent; }
        .recording-pulse { animation: pulse 1.5s infinite; color: #ef4444; font-weight: 900; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-slate-900 font-sans">

    <!-- SIDEBAR (FULL 7-ITEM) -->
    <div class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl font-bold uppercase text-[10px] tracking-wider">
        <div class="p-6 text-2xl font-black border-b border-slate-800 italic text-red-600 tracking-tighter">⦿ PLEX CRM</div>
        <nav id="sidebar-nav" class="flex-1 p-4 space-y-1">
            <a href="index.html" class="nav-item block p-3 hover:bg-slate-800 rounded">👥 Klient-Oversigt</a>
            <a href="approvals.html" class="nav-item block p-3 hover:bg-slate-800 rounded">⏳ Godkendelser</a>
            <a href="resellers.html" class="nav-item block p-3 hover:bg-slate-800 rounded">👤 Resellers</a>
            <a href="commission.html" class="nav-item block p-3 hover:bg-slate-800 rounded text-yellow-500">💰 Provision & Tal</a>
            <a href="settings.html" class="nav-item block p-3 hover:bg-slate-800 rounded text-emerald-400">⚙️ Pakker</a>
            <a href="telegram.html" class="nav-item block p-3 bg-red-600 rounded nav-active text-white border-t border-slate-800 mt-4 italic">💬 Telegram Chat</a>
            <a href="payments.html" class="nav-item block p-3 hover:bg-slate-800 rounded">💳 Betalinger</a>
        </nav>
        <div class="p-4 border-t border-slate-800 bg-black/20 text-center italic text-[9px] uppercase tracking-widest text-slate-500">Admin: Brian</div>
    </div>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center px-10 border-b">
            <div class="flex items-center space-x-6">
                <h2 class="text-xl font-black uppercase italic tracking-tighter">Telegram <span class="text-sky-500" id="header-bot-title">Support</span></h2>
                <div class="flex bg-slate-100 p-1 rounded-lg border italic shadow-inner">
                    <button id="acc-support" onclick="switchBot('support')" class="btn-active-support px-6 py-2 rounded text-[10px] font-black uppercase tracking-widest transition-all">Support Bot</button>
                    <button id="acc-info" onclick="switchBot('info')" class="btn-inactive px-6 py-2 rounded text-[10px] font-black uppercase tracking-widest transition-all">Broadcast Bot</button>
                </div>
            </div>
            <button onclick="openTokenModal()" class="text-slate-300 hover:text-sky-500 transition text-2xl">⚙️</button>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- CHAT LISTE -->
            <div class="w-80 bg-white border-r flex flex-col shrink-0">
                <div class="p-4 border-b bg-slate-50/50 italic font-black uppercase"><input type="text" placeholder="SØG..." class="w-full text-[11px] p-2 border rounded-xl outline-none"></div>
                <div id="chat-list" class="flex-1 overflow-y-auto divide-y uppercase italic font-bold"></div>
            </div>

            <!-- CHAT VINDUE -->
            <div class="flex-1 flex flex-col bg-[#f0f2f5] relative">
                <div id="chat-header-bar" class="p-4 bg-white/80 backdrop-blur border-b hidden font-black uppercase shadow-sm">
                    <h3 class="text-xs text-slate-700 italic" id="active-user-name">Kunde</h3>
                </div>
                
                <div id="message-container" class="flex-1 p-6 chat-scroll space-y-2">
                    <div class="h-full flex flex-col items-center justify-center text-gray-300 italic font-black uppercase text-xs">
                        <span id="no-chat-text">Vælg en samtale i listen</span>
                    </div>
                </div>

                <div id="chat-input-area" class="p-6 bg-white border-t hidden">
                    <div class="flex items-center space-x-6 bg-slate-50 p-3 rounded-2xl border-2 border-slate-200 shadow-inner">
                        <div class="flex space-x-4 px-4 border-r border-slate-200 text-2xl">
                            <button onclick="triggerFile('img')" title="Billede">🖼️</button>
                            <button onclick="triggerFile('vid')" title="Video">📹</button>
                            <button id="voice-btn" onclick="toggleVoice()" title="Voice">🎤</button>
                        </div>
                        <input type="file" id="file-img" onchange="handleFileUpload(this, 'img')" class="hidden">
                        <input type="file" id="file-vid" onchange="handleFileUpload(this, 'vid')" class="hidden">

                        <input type="text" id="msg-input" placeholder="Skriv besked..." class="flex-1 bg-transparent text-lg outline-none font-bold italic px-4">
                        <button onclick="doSendMessage()" class="bg-sky-500 text-white px-12 py-4 rounded-xl font-black uppercase text-xs shadow-xl">Send</button>
                    </div>
                    <div id="rec-indicator" class="hidden text-center mt-3 text-sm font-black uppercase tracking-widest recording-pulse">🔴 OPTAGER LYD...</div>
                </div>
            </div>

            <div class="w-80 bg-white border-l p-6 flex flex-col space-y-8 italic font-black text-[10px] tracking-widest overflow-y-auto shadow-2xl">
                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 shadow-inner text-center">
                    <h4 class="text-slate-400 mb-4 border-b pb-1 uppercase italic">Opret Intern Note</h4>
                    <textarea id="note-text" class="h-28 mb-3 italic bg-white" placeholder="Beskrivelse..."></textarea>
                    <button onclick="saveNote()" class="bg-slate-900 text-white w-full py-4 rounded-xl shadow-xl uppercase tracking-widest">Gem Note</button>
                </div>
                <div id="note-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: TOKENS -->
    <div id="tokenModal" class="modal"><div class="modal-content"><h2 class="text-xl font-black border-b pb-4 mb-6 uppercase text-sky-600 italic">API Setup</h2><div class="space-y-4"><div><label>Support Bot Token</label><input type="password" id="t-support"></div><div><label>Info Bot Token</label><input type="password" id="t-info"></div></div><div class="mt-8 flex justify-end"><button onclick="closeModal()" class="mr-6 text-gray-400 uppercase">Luk</button><button onclick="alert('Tokens gemt!')" class="bg-slate-900 text-white px-10 py-3 rounded-lg uppercase text-xs font-black">Gem</button></div></div></div>

    <script>
        let allMessages = [];
        let activeId = null;
        let activeBot = 'support';
        let mediaRecorder;
        let audioChunks = [];

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? '' : d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/messages');
                allMessages = await res.json();
                renderList();
                if(activeId) renderChat(activeId);
            } catch(e) {}
        }

        function renderList() {
            const list = document.getElementById('chat-list');
            const unique = {};
            // Vigtigt: Filtrer KUN beskeder der matcher den aktive bot-type
            allMessages.filter(m => m.bot_type === activeBot).forEach(m => unique[m.chat_id] = m);
            
            const entries = Object.values(unique).reverse();
            if(entries.length === 0) {
                list.innerHTML = `<div class="p-10 text-center text-slate-300 uppercase text-[9px] font-black italic">Ingen samtaler fundet</div>`;
                return;
            }

            list.innerHTML = entries.map(m => `
                <div onclick="selectChat('${m.chat_id}', '${m.sender_name}')" class="p-6 cursor-pointer hover:bg-slate-50 border-b transition ${activeId == m.chat_id ? 'bg-sky-50 border-l-8 border-sky-500 shadow-sm' : ''}">
                    <div class="flex justify-between items-center mb-1"><span class="text-slate-800 font-black text-sm">${m.sender_name}</span></div>
                    <div class="text-[11px] text-slate-400 truncate italic">${m.message_text}</div>
                </div>`).join('');
        }

        function selectChat(id, name) {
            activeId = id;
            document.getElementById('chat-header-bar').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            document.getElementById('active-user-name').innerText = name;
            renderChat(id);
            renderList();
        }

        function renderChat(id) {
            const box = document.getElementById('message-container');
            // Vigtigt: Vis kun beskeder for den aktive bot og den aktive chat_id
            const chatMsgs = allMessages.filter(m => m.chat_id == id && m.bot_type === activeBot);
            
            if(chatMsgs.length === 0) {
                box.innerHTML = '<div class="h-full flex items-center justify-center text-gray-300 font-black uppercase text-xs italic">Ingen beskeder endnu</div>';
                return;
            }

            box.innerHTML = chatMsgs.map(m => `
                <div class="message-bubble ${m.direction == 'in' ? 'msg-in shadow-sm' : 'msg-out shadow-md'}">
                    <div class="not-italic font-bold">${m.message_text}</div>
                    <div class="text-[8px] text-right mt-2 opacity-50 font-black uppercase">${formatDate(m.created_at)}</div>
                </div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function doSendMessage() {
            const input = document.getElementById('msg-input');
            if(!input.value || !activeId) return;
            await fetch('/api/send-message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chatId: activeId, text: input.value, botType: activeBot })
            });
            input.value = '';
            fetchHistory();
        }

        // --- KONTO SKIFTER (Rydder alt) ---
        function switchBot(t) {
            activeBot = t;
            activeId = null; // Nulstil valgt samtale
            
            // Opdater UI
            document.getElementById('header-bot-title').innerText = (t === 'support') ? 'Support' : 'Broadcast';
            document.getElementById('acc-support').className = (t === 'support') ? 'btn-active-support px-6 py-2 rounded text-[10px] font-black uppercase tracking-widest' : 'btn-inactive px-6 py-2 rounded text-[10px] font-black uppercase tracking-widest';
            document.getElementById('acc-info').className = (t === 'info') ? 'btn-active-info px-6 py-2 rounded text-[10px] font-black uppercase tracking-widest' : 'btn-inactive px-6 py-2 rounded text-[10px] font-black uppercase tracking-widest';
            
            // Skjul chat-område og tøm besked-boks
            document.getElementById('chat-header-bar').classList.add('hidden');
            document.getElementById('chat-input-area').classList.add('hidden');
            document.getElementById('message-container').innerHTML = '<div class="h-full flex flex-center items-center justify-center text-gray-300 italic font-black uppercase text-xs">Skiftet konto... Vælg samtale i listen.</div>';
            
            fetchHistory(); // Hent data for den nye bot
        }

        // --- FIL & VOICE ---
        function triggerFile(id) { document.getElementById('file-'+id).click(); }
        async function handleFileUpload(input, type) {
            const formData = new FormData();
            formData.append('file', input.files[0]);
            formData.append('chatId', activeId);
            formData.append('type', type);
            formData.append('botType', activeBot);
            await fetch('/api/send-media', { method: 'POST', body: formData });
            fetchHistory();
        }

        async function toggleVoice() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                document.getElementById('rec-indicator').classList.add('hidden');
                document.getElementById('voice-btn').innerText = "🎤";
            } else {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'voice.ogg');
                    formData.append('chatId', activeId);
                    formData.append('type', 'voice');
                    formData.append('botType', activeBot);
                    await fetch('/api/send-media', { method: 'POST', body: formData });
                    fetchHistory();
                };
                mediaRecorder.start();
                document.getElementById('rec-indicator').classList.remove('hidden');
                document.getElementById('voice-btn').innerText = "⏹️";
            }
        }

        function saveNote() {
            const text = document.getElementById('note-text').value;
            if(!text) return;
            const div = document.createElement('div');
            div.className = "bg-yellow-50 p-4 rounded-xl border border-yellow-100 shadow-sm";
            div.innerHTML = `<p class="font-black text-yellow-900 leading-tight">${text}</p><span class="text-[8px] opacity-40 block mt-3 uppercase font-black">${formatDate(new Date())}</span>`;
            document.getElementById('note-list').prepend(div);
            document.getElementById('note-text').value = '';
        }

        function closeModal() { document.getElementById('tokenModal').style.display = 'none'; }
        function openTokenModal() { document.getElementById('tokenModal').style.display = 'block'; }
        
        setInterval(fetchHistory, 5000);
    </script>
</body>
</html>
