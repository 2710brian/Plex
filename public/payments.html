<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex CRM - Betalinger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { background-color: white; margin: 5% auto; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; border-top: 8px solid #6366f1; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #4b5563; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
        input, select { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; font-size: 0.85rem; background-color: #f9fafb; margin-bottom: 10px; font-weight: 600; }
        .nav-active { background-color: #dc2626 !important; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .section-title { border-bottom: 2px solid #f3f4f6; margin: 20px 0 12px 0; padding-bottom: 6px; color: #111827; font-weight: 900; text-transform: uppercase; font-size: 0.85rem; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-slate-900 font-sans uppercase font-black italic">

    <script>
        // --- SIKKERHED OG RETTIGHEDS-STYRING ---
        const user = JSON.parse(localStorage.getItem('crm_user'));
        if(!user) { window.location.href = '/login.html'; }

        function checkAccess() {
            if (user.type === 'admin') return; 
            const allowedPages = user.menu_access ? user.menu_access.split(',') : ['index.html'];
            document.querySelectorAll('#sidebar-nav a').forEach(link => {
                const href = link.getAttribute('href');
                if (!allowedPages.includes(href)) { link.style.display = 'none'; }
            });
            if (!allowedPages.includes('payments.html')) { window.location.href = '/index.html'; }
        }
        function logout() { localStorage.removeItem('crm_user'); window.location.href = '/login.html'; }
    </script>

    <!-- SIDEBAR (UNIFORM ACROSS ALL) -->
    <div class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl tracking-wider not-italic">
        <div class="p-6 text-2xl font-black border-b border-slate-800 text-red-600 tracking-tighter">⦿ PLEX CRM</div>
        <nav id="sidebar-nav" class="flex-1 p-4 space-y-1 text-[10px] font-bold uppercase tracking-widest">
            <a href="index.html" class="nav-item block p-3 hover:bg-slate-800 rounded">👥 Klient-Oversigt</a>
            <a href="approvals.html" id="nav-approvals" class="nav-item block p-3 hover:bg-slate-800 rounded flex justify-between items-center text-orange-400">
                <span>⏳ Godkendelser</span>
                <span class="bg-orange-600 text-white text-[9px] px-2 py-0.5 rounded-full font-black" id="badge-count">0</span>
            </a>
            <a href="resellers.html" id="nav-resellers" class="nav-item block p-3 hover:bg-slate-800 rounded text-blue-400">👤 Resellers</a>
            <a href="commission.html" id="nav-commission" class="nav-item block p-3 hover:bg-slate-800 rounded text-yellow-500 font-black">💰 Provision & Tal</a>
            <a href="settings.html" id="nav-settings" class="nav-item block p-3 hover:bg-slate-800 rounded text-emerald-400">⚙️ Pakker</a>
            <a href="payments.html" class="nav-item block p-3 bg-red-600 rounded nav-active text-white mt-4 border-t border-slate-800 pt-4">💳 Betalinger</a>
            
            <button onclick="logout()" class="w-full text-left p-3 hover:bg-red-900/30 text-red-500 mt-10 border-t border-slate-800 transition-colors flex items-center italic">
                <span class="mr-2 text-lg">🔒</span> Log ud
            </button>
        </nav>
        <div class="p-4 border-t border-slate-800 bg-black/20 text-center text-[9px]">Admin: Brian</div>
    </div>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col overflow-hidden not-italic">
        <header class="bg-white shadow-sm p-5 flex justify-between items-center px-10 border-b italic font-black uppercase">
            <div class="flex items-center space-x-8">
                <h2 class="text-2xl text-indigo-600 tracking-tighter">Betalings Log</h2>
                <input type="text" id="paySearch" onkeyup="render()" placeholder="SØG TRANSAKTION..." class="w-80 bg-slate-50 border-2 border-slate-100 rounded-xl py-2 px-4 text-[11px] outline-none focus:border-indigo-500 transition-all">
            </div>
            <button onclick="openModal()" class="bg-indigo-600 text-white px-8 py-2.5 rounded-xl shadow-xl text-[10px] tracking-widest font-black italic shadow-lg">+ Registrer Betaling</button>
        </header>

        <main class="flex-1 overflow-auto p-10 font-black italic uppercase">
            <div class="bg-white rounded-xl shadow-2xl border border-indigo-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-indigo-50 text-indigo-800 text-[10px] tracking-widest border-b uppercase">
                        <tr><th class="p-5">Dato</th><th class="p-5">Kunde</th><th class="p-5">Metode</th><th class="p-5">Beløb (€)</th><th class="p-5">Agent</th><th class="p-5 text-center">Status</th></tr>
                    </thead>
                    <tbody id="payout-table-body" class="text-[12px] divide-y divide-gray-50 tracking-tight">
                        <!-- Indlæses via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL: REGISTRER BETALING (MED SMART AUTOCOMPLETE) -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h2 class="text-2xl font-black border-b pb-4 mb-8 text-indigo-600 uppercase italic underline decoration-indigo-200">Ny Betaling</h2>
            <form id="payForm" onsubmit="savePayment(event)" class="space-y-6 italic font-black">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label>Søg & Vælg Kunde</label>
                        <!-- 'list' kobler inputtet til vores datalist nedenfor -->
                        <input type="text" id="p-customer" list="customerList" placeholder="Skriv navn..." required class="border-2 border-indigo-50 focus:border-indigo-500">
                        <datalist id="customerList">
                            <!-- Fyldes dynamisk af JS fra /api/customers -->
                        </datalist>
                    </div>
                    <div><label>Beløb (€)</label><input type="number" id="p-amount" step="0.01" placeholder="0,00" required></div>
                    <div><label>Betalings-metode</label><select id="p-method"><option>Vivid</option><option>Revolut</option><option>Cash</option></select></div>
                    <div><label>Modtaget af Agent</label><select id="p-agent"><option>Brian (Admin)</option><option>Kenneth (KU)</option></select></div>
                </div>
                <div class="mt-10 pt-6 border-t flex justify-end font-black uppercase text-[10px]">
                    <button type="button" onclick="closeModal()" class="mr-8 text-gray-400">Annuller</button>
                    <button type="submit" class="bg-indigo-600 text-white px-12 py-3 rounded-xl shadow-2xl hover:bg-indigo-700 transition">Gem Betaling</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let payments = [];
        let customers = [];

        async function fetchAll() {
            try {
                // Hent betalinger
                const res = await fetch('/api/payments');
                payments = await res.json();
                
                // Hent kunder til autocomplete
                const cRes = await fetch('/api/customers');
                customers = await cRes.json();
                
                updateCustomerDatalist();
                render();
            } catch (e) { console.error(e); }
        }

        function updateCustomerDatalist() {
            const list = document.getElementById('customerList');
            list.innerHTML = customers.map(c => `<option value="${c.name}">`).join('');
        }

        function render() {
            const term = document.getElementById('paySearch').value.toLowerCase();
            const tbody = document.getElementById('payout-table-body');
            tbody.innerHTML = payments.filter(p => p.customer_name.toLowerCase().includes(term)).map(p => `
                <tr class="hover:bg-indigo-50 transition border-b">
                    <td class="p-5 font-mono text-[10px]">${new Date(p.payment_date).toLocaleDateString()}</td>
                    <td class="p-5 font-black text-slate-800">${p.customer_name}</td>
                    <td class="p-5 text-indigo-600 font-bold">${p.method}</td>
                    <td class="p-5 font-black text-slate-900">€ ${parseFloat(p.amount_eur).toFixed(2)}</td>
                    <td class="p-5 text-slate-400 font-bold">${p.agent_name}</td>
                    <td class="p-5 text-center"><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-[9px] font-black">BETALT</span></td>
                </tr>`).join('');
        }

        async function savePayment(e) {
            e.preventDefault();
            const data = { 
                customer_name: document.getElementById('p-customer').value, 
                amount_eur: document.getElementById('p-amount').value, 
                method: document.getElementById('p-method').value, 
                agent_name: document.getElementById('p-agent').value 
            };
            const res = await fetch('/api/payments/save', { 
                method:'POST', 
                headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify(data) 
            });
            if(res.ok) { closeModal(); fetchAll(); }
        }

        function openModal() { document.getElementById('paymentModal').style.display = 'block'; }
        function closeModal() { document.getElementById('paymentModal').style.display = 'none'; }
        
        window.onload = function() {
            checkAccess();
            fetchAll();
        };
    </script>
</body>
</html>
