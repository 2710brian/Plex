<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex CRM - Partner Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); }
        .modal-content { background-color: white; margin: 1% auto; padding: 30px; border-radius: 12px; width: 90%; max-width: 900px; border-top: 8px solid #3b82f6; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #4b5563; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
        input, select { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; font-size: 0.85rem; background-color: #f9fafb; margin-bottom: 10px; font-weight: 600; }
        .nav-active { background-color: #dc2626 !important; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .section-title { border-bottom: 2px solid #f3f4f6; margin: 20px 0 12px 0; padding-bottom: 6px; color: #111827; font-weight: 900; text-transform: uppercase; font-size: 0.85rem; display: flex; justify-content: space-between; }
        .pkg-card, .access-card { transition: all 0.2s; border: 2px solid #f1f5f9; padding: 12px; border-radius: 12px; background: white; shadow: sm; }
        tr.clickable { cursor: pointer; transition: all 0.1s; }
        tr.clickable:hover { background-color: #f0f7ff !important; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-slate-900 font-sans">

    <script>
        const user = JSON.parse(localStorage.getItem('crm_user'));
        if(!user) { window.location.href = '/login.html'; }

        function checkAccess() {
            // NØDFIX: Spring tjekket over for at undgå at siden smider dig ud
            return; 
        }

        function logout() { localStorage.removeItem('crm_user'); window.location.href = '/login.html'; }
    </script>

    <!-- SIDEBAR -->
    <div class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl font-bold uppercase text-[10px] tracking-wider">
        <div class="p-6 text-2xl font-black border-b border-slate-800 italic text-red-600 tracking-tighter text-red-600">⦿ PLEX CRM</div>
        <nav id="sidebar-nav" class="flex-1 p-4 space-y-1">
            <a href="index.html" class="nav-item block p-3 hover:bg-slate-800 rounded">👥 <span data-dk="Klient-Oversigt" data-uk="Client Overview">Klient-Oversigt</span></a>
            <a href="approvals.html" id="nav-approvals" class="nav-item block p-3 hover:bg-slate-800 rounded flex justify-between items-center text-orange-400 italic font-black">
                <span>⏳ <span data-dk="Godkendelser" data-uk="Approvals">Godkendelser</span></span>
                <span class="bg-orange-600 text-white text-[9px] px-2 py-0.5 rounded-full" id="badge-approvals">0</span>
            </a>
            <a href="resellers.html" id="nav-resellers" class="nav-item block p-3 bg-red-600 rounded nav-active text-white italic font-black">👤 <span data-dk="Reseller Styring" data-uk="Reseller Mgmt">Reseller Styring</span></a>
            <a href="commission.html" id="nav-commission" class="nav-item block p-3 hover:bg-slate-800 rounded text-yellow-500 font-black italic">💰 <span data-dk="Provision & Tal" data-uk="Profit & Data">Provision & Tal</span></a>
            <a href="settings.html" id="nav-settings" class="nav-item block p-3 hover:bg-slate-800 rounded text-emerald-400 font-black">⚙️ <span data-dk="Pakke Indstillinger" data-uk="Package Settings">Pakke Indstillinger</span></a>
            <a href="payments.html" id="nav-payments" class="nav-item block p-3 hover:bg-slate-800 rounded text-slate-500 font-black italic uppercase">💳 <span data-dk="Betalinger" data-uk="Payments">Betalinger</span></a>
            
            <button onclick="logout()" class="w-full text-left p-3 hover:bg-red-900/30 text-red-500 mt-10 border-t border-slate-800 transition-colors flex items-center italic">
                <span class="mr-2 text-lg">🔒</span> Log ud
            </button>
        </nav>
        
        <div class="p-4 border-t border-slate-800 bg-black/20 text-center text-[9px] italic uppercase tracking-widest font-black text-slate-500">
            Admin: Brian
        </div>
    </div>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm p-5 flex justify-between items-center px-10 border-b italic font-black uppercase">
            <div class="flex items-center space-x-8 flex-1">
                <h2 class="text-2xl text-blue-600 tracking-tighter">Partner Administration</h2>
                <input type="text" id="resellerSearch" onkeyup="render()" placeholder="SØG PARTNER..." class="w-80 bg-slate-50 border-2 border-slate-100 rounded-xl py-2 px-4 text-[11px] font-black outline-none focus:border-blue-500 transition-all mb-0 shadow-inner">
            </div>
            <button id="add-partner-btn" onclick="openPartnerModal(false)" class="bg-blue-600 text-white px-10 py-3 rounded shadow-2xl hover:bg-blue-700 transition text-[11px] tracking-widest">+ Opret Partner</button>
        </header>

        <main class="flex-1 overflow-auto p-10">
            <div class="bg-white rounded-xl shadow-2xl border border-blue-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-blue-50 text-blue-800 text-[10px] font-black uppercase tracking-[0.2em] border-b italic">
                        <tr>
                            <th class="p-5">Partner / Navn</th>
                            <th class="p-5 text-center">Type</th>
                            <th class="p-5">Menu Adgang</th>
                            <th class="p-5 text-center">Status</th>
                            <th class="p-5 text-center">Handling</th>
                        </tr>
                    </thead>
                    <tbody id="partner-table-body" class="text-[12px] font-bold divide-y uppercase tracking-tight italic"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL: PARTNER KONFIGURATION -->
    <div id="partnerModal" class="modal">
        <div class="modal-content shadow-2xl">
            <div class="flex justify-between items-center border-b pb-4 mb-8 font-black text-blue-600 uppercase tracking-tighter italic leading-none">
                <h2 class="text-3xl" id="modal-title">Konfigurer Partner</h2>
                <button onclick="closeModal()" class="text-gray-300 hover:text-black text-5xl font-light transition">&times;</button>
            </div>
            
            <form id="partnerForm" onsubmit="savePartner(event)" class="space-y-8 italic font-black text-slate-700">
                <input type="hidden" id="p-id">
                
                <section>
                    <h3 class="section-title">1. Profile Details & Password</h3>
                    <div class="grid grid-cols-3 gap-6 font-black">
                        <div><label>Fulde Navn</label><input type="text" id="p-name" required></div>
                        <div><label>E-mail / Login</label><input type="text" id="p-email"></div>
                        <div class="relative">
                            <label>Password</label>
                            <input type="password" id="p-pass" class="border-red-100 bg-red-50 pr-10 text-red-600">
                            <button type="button" onclick="togglePass()" class="absolute right-3 top-8 text-slate-400">👁️</button>
                        </div>
                        <div class="admin-only">
                            <label>Partner Type</label>
                            <select id="p-type" class="border-blue-200 bg-blue-50"><option value="agent">AGENT</option><option value="reseller">RESELLER</option></select>
                        </div>
                        <div><label>Sprog</label><select id="p-lang"><option value="dk">Dansk (DK)</option><option value="uk">English (UK)</option></select></div>
                        <div class="admin-only"><label>Status</label><select id="p-status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
                    </div>
                </section>

                <div class="grid grid-cols-2 gap-10 admin-only">
                    <section class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-100 shadow-inner">
                        <h3 class="section-title border-blue-200 text-blue-600 font-black italic">2. Menu Adgang</h3>
                        <div class="space-y-3 font-bold italic text-[11px]">
                            <label class="access-card flex items-center space-x-4"><input type="checkbox" value="index.html" class="menu-check w-5 h-5 accent-blue-600"> <span>Klient-Oversigt</span></label>
                            <label class="access-card flex items-center space-x-4"><input type="checkbox" value="approvals.html" class="menu-check w-5 h-5 accent-blue-600"> <span>Godkendelser</span></label>
                            <label class="access-card flex items-center space-x-4"><input type="checkbox" value="commission.html" class="menu-check w-5 h-5 accent-blue-600"> <span>Provision & Tal</span></label>
                            <label class="access-card flex items-center space-x-4"><input type="checkbox" value="settings.html" class="menu-check w-5 h-5 accent-blue-600"> <span>Pakke Indstillinger</span></label>
                        </div>
                    </section>

                    <section class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-100 shadow-inner">
                        <h3 class="section-title border-blue-200 text-blue-600 font-black italic">3. Pakke Adgang</h3>
                        <div class="grid grid-cols-1 gap-2 text-[11px]">
                            <label class="pkg-card flex items-center space-x-3"><input type="checkbox" value="1" class="pkg-check w-5 h-5"> <span>#1 Plex Årlig</span></label>
                            <label class="pkg-card flex items-center space-x-3"><input type="checkbox" value="2" class="pkg-check w-5 h-5"> <span>#2 Plex Månedlig</span></label>
                            <label class="pkg-card flex items-center space-x-3"><input type="checkbox" value="3" class="pkg-check w-5 h-5"> <span>#3 IPTV Månedlig</span></label>
                            <label class="pkg-card flex items-center space-x-3"><input type="checkbox" value="4" class="pkg-check w-5 h-5"> <span>#4 Combo Månedlig</span></label>
                            <label class="pkg-card flex items-center space-x-3"><input type="checkbox" value="5" class="pkg-check w-5 h-5"> <span>#5 Combo Årlig</span></label>
                            <label class="pkg-card flex items-center space-x-3"><input type="checkbox" value="6" class="pkg-check w-5 h-5"> <span>#6 Combo + Boks</span></label>
                        </div>
                    </section>
                </div>

                <div class="mt-12 pt-8 border-t flex justify-between items-center italic">
                    <button type="button" id="del-p-btn" onclick="deletePartner()" class="bg-red-100 text-red-600 px-8 py-4 rounded-xl font-black uppercase text-[10px] hidden admin-only">Slet Partner 🗑️</button>
                    <div class="flex space-x-6 ml-auto font-black uppercase">
                        <button type="button" onclick="closeModal()" class="text-gray-400 text-[11px]">Luk</button>
                        <button type="submit" id="save-btn" class="bg-blue-600 text-white px-16 py-5 rounded-xl text-sm shadow-2xl">Gem Ændringer</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let resellers = [];

        async function fetchAll() {
            try {
                const res = await fetch('/api/resellers');
                resellers = await res.json();
                render();
                
                const cRes = await fetch('/api/customers');
                const cData = await cRes.json();
                document.getElementById('badge-approvals').innerText = cData.filter(c => c.status === 'Inactive' || c.status === 'Pending').length;
            } catch(e) { console.error(e); }
        }

        function render() {
            const term = document.getElementById('resellerSearch').value.toLowerCase();
            document.getElementById('partner-table-body').innerHTML = resellers.filter(r => r.name.toLowerCase().includes(term)).map(r => `
                <tr class="clickable hover:bg-blue-50/50 transition border-b border-gray-50" onclick="openPartnerModal(true, ${r.id})">
                    <td class="p-5 font-black text-slate-800">${r.name}<div class="text-[9px] text-slate-400 italic">${r.email||''}</div></td>
                    <td class="p-5 text-center text-blue-600 font-black text-[10px] uppercase">${r.type}</td>
                    <td class="p-5 text-[9px] italic text-slate-400 truncate max-w-[150px] font-black">${r.menu_access||'Standard'}</td>
                    <td class="p-5 text-center text-green-600 underline">${r.status}</td>
                    <td class="p-5 text-center text-gray-200 text-xl font-light">⚙️</td>
                </tr>`).join('');
        }

        function openPartnerModal(isEdit, id) {
            document.getElementById('partnerModal').style.display = 'block';
            const isAdmin = (user.type === 'admin');
            
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? 'block' : 'none');
            document.getElementById('add-partner-btn').style.display = isAdmin ? 'block' : 'none';

            if(isEdit) {
                const r = resellers.find(x => x.id === id);
                document.getElementById('p-id').value = r.id;
                document.getElementById('p-name').value = r.name;
                document.getElementById('p-email').value = r.email||'';
                document.getElementById('p-pass').value = r.password||'';
                document.getElementById('p-type').value = r.type;
                document.getElementById('p-status').value = r.status;
                
                const menus = (r.menu_access || '').split(',');
                document.querySelectorAll('.menu-check').forEach(cb => cb.checked = menus.includes(cb.value));
                const pkgs = (r.access_packages || '').split(',');
                document.querySelectorAll('.pkg-check').forEach(cb => cb.checked = pkgs.includes(cb.value));
                
                document.getElementById('del-p-btn').classList.toggle('hidden', !isAdmin);
                document.getElementById('modal-title').innerText = "Partner: " + r.name;
            } else {
                document.getElementById('partnerForm').reset();
                document.getElementById('p-id').value = '';
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                document.getElementById('del-p-btn').classList.add('hidden');
                document.getElementById('modal-title').innerText = "Opret Ny Partner";
            }
        }

        function togglePass() {
            const p = document.getElementById('p-pass');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        async function savePartner(e) {
            e.preventDefault();
            const data = {
                id: document.getElementById('p-id').value,
                name: document.getElementById('p-name').value,
                email: document.getElementById('p-email').value,
                password: document.getElementById('p-pass').value,
                type: document.getElementById('p-type').value,
                status: document.getElementById('p-status').value,
                menu_access: Array.from(document.querySelectorAll('.menu-check:checked')).map(cb => cb.value).join(','),
                access_packages: Array.from(document.querySelectorAll('.pkg-check:checked')).map(cb => cb.value).join(',')
            };
            await fetch('/api/resellers/save', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
            closeModal(); fetchAll();
        }

        async function deletePartner() {
            const id = document.getElementById('p-id').value;
            if(!confirm('Slet partner?')) return;
            await fetch('/api/resellers/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id}) });
            closeModal(); fetchAll();
        }

        function closeModal() { document.getElementById('partnerModal').style.display = 'none'; }
        window.onload = function() { checkAccess(); fetchAll(); };
    </script>
</body>
</html>
