<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Plex CRM - Telegram Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-scroll { height: calc(100vh - 180px); overflow-y: auto; display: flex; flex-direction: column; }
        .message-bubble { max-width: 80%; border-radius: 12px; padding: 10px 15px; margin-bottom: 8px; font-size: 13px; line-height: 1.4; }
        .msg-in { background-color: #f3f4f6; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg-out { background-color: #0ea5e9; color: white; align-self: flex-end; border-bottom-right-radius: 2px; shadow: 0 2px 4px rgba(14,165,233,0.3); }
        .nav-active { background-color: #dc2626 !important; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-slate-900 font-sans font-medium uppercase text-[11px] italic">

    <!-- SIDEBAR -->
    <div class="w-64 bg-slate-900 text-white flex flex-col shrink-0 shadow-2xl tracking-wider not-italic">
        <div class="p-6 text-2xl font-black border-b border-slate-800 text-red-600">⦿ PLEX CRM</div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="index.html" class="block p-3 hover:bg-slate-800 rounded">👥 Klienter</a>
            <a href="telegram.html" class="block p-3 bg-red-600 rounded nav-active text-white">💬 Telegram Chat</a>
        </nav>
    </div>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col overflow-hidden not-italic">
        <header class="bg-white p-4 flex justify-between items-center px-10 border-b shadow-sm font-black italic uppercase">
            <h2 class="text-xl">Telegram <span class="text-sky-500">Live Support</span></h2>
            <div class="text-[10px] text-emerald-500 animate-pulse">● System Connected</div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- LISTE -->
            <div class="w-80 bg-white border-r flex flex-col shrink-0">
                <div id="chat-list" class="flex-1 overflow-y-auto divide-y divide-gray-50"></div>
            </div>

            <!-- CHAT VINDUE -->
            <div class="flex-1 flex flex-col bg-[#f0f2f5]">
                <div id="chat-header" class="p-4 bg-white border-b hidden font-black italic uppercase">
                    <h3 id="active-user-name" class="text-sm">Vælg chat</h3>
                </div>
                
                <div id="message-container" class="flex-1 p-6 chat-scroll space-y-2">
                    <div class="h-full flex items-center justify-center text-gray-300">Vælg en samtale i listen til venstre</div>
                </div>

                <div id="input-area" class="p-4 bg-white border-t hidden">
                    <div class="flex space-x-3 bg-slate-50 p-2 rounded-xl border">
                        <input type="text" id="msg-input" placeholder="Skriv svar..." class="flex-1 bg-transparent outline-none p-2 text-sm font-bold">
                        <button onclick="doSendMessage()" class="bg-sky-500 text-white px-8 py-2 rounded-lg font-black uppercase text-[10px] shadow-lg">Send</button>
                    </div>
                </div>
            </div>

            <!-- HØJRE KOLONNE (NOTER & FILER) -->
            <div class="w-72 bg-white border-l p-6 flex flex-col space-y-8 uppercase italic font-black text-[10px]">
                <div>
                    <h4 class="text-slate-400 mb-4 border-b pb-1">Interne Noter</h4>
                    <textarea id="note-input" class="w-full h-32 border rounded p-3 bg-yellow-50 text-yellow-900 text-[11px] mb-2" placeholder="Skriv en note om kunden..."></textarea>
                    <button class="bg-slate-800 text-white w-full py-2 rounded shadow">Gem Note</button>
                </div>
                <div>
                    <h4 class="text-slate-400 mb-4 border-b pb-1">Vedhæftede filer</h4>
                    <input type="file" id="file-input" class="hidden">
                    <button onclick="document.getElementById('file-input').click()" class="border-2 border-dashed border-slate-200 w-full py-6 rounded text-slate-300 hover:border-sky-300 hover:text-sky-400 transition">📎 Vedhæft Fil</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let activeId = null;

        async function load() {
            const res = await fetch('/api/messages');
            messages = await res.json();
            renderList();
            if(activeId) renderChat(activeId);
        }

        function renderList() {
            const list = document.getElementById('chat-list');
            const unique = {};
            messages.forEach(m => unique[m.chat_id] = m);
            list.innerHTML = Object.values(unique).reverse().map(m => `
                <div onclick="select('${m.chat_id}', '${m.sender_name}')" class="p-4 cursor-pointer hover:bg-sky-50 ${activeId == m.chat_id ? 'bg-sky-50 border-l-4 border-sky-500' : ''}">
                    <div class="font-black text-slate-800">${m.sender_name}</div>
                    <div class="text-[9px] text-gray-400 truncate">${m.message_text}</div>
                </div>
            `).join('');
        }

        function select(id, name) {
            activeId = id;
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('active-user-name').innerText = name;
            renderChat(id);
        }

        function renderChat(id) {
            const box = document.getElementById('message-container');
            const chatMsgs = messages.filter(m => m.chat_id == id);
            box.innerHTML = chatMsgs.map(m => `
                <div class="message-bubble ${m.direction == 'in' ? 'msg-in' : 'msg-out'} shadow-sm">
                    ${m.message_text}
                    <div class="text-[7px] text-right mt-1 opacity-50">${new Date(m.created_at).toLocaleTimeString()}</div>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function doSendMessage() {
            const text = document.getElementById('msg-input').value;
            if(!text || !activeId) return;
            await fetch('/api/send-message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chatId: activeId, text: text })
            });
            document.getElementById('msg-input').value = '';
            load(); // Genindlæs for at se din egen besked i chatten
        }

        setInterval(load, 3000);
        window.onload = load;
    </script>
</body>
</html>
